# Tamlil: search YouTube videos by what is said in them.
# Everything that talks to YouTube leaves through this stack's own gluetun.
# The gateway answers on 127.0.0.1:8445. Settings are in .env (see .env.example), and anything
# that only fits one server (another address to listen on, the mail network) goes in
# docker-compose.override.yml (see docker-compose.override.example.yml).
name: tamlil

x-app: &app
  image: tamlil:latest
  user: "${TAMLIL_USER:-1000:1000}"
  restart: unless-stopped
  volumes:
    - ${DATA_DIR:-./data}:/data
  environment: &app-env
    TAMLIL_DATA: /data
    XDG_CACHE_HOME: /data/cache
    DENO_DIR: /data/cache/deno
    PLAYER_URL: ${PLAYER_URL:-}
    TAMLIL_URL: ${TAMLIL_URL:-http://localhost:8445}
    TAMLIL_SIGNATURE: ${TAMLIL_SIGNATURE:-Tamlil}
    TZ: ${TZ:-UTC}

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: tamlil-gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      DNS_UPSTREAM_RESOLVER_TYPE: doh   # DoT got reset on some Proton exits
      HTTPPROXY: "on"                   # the worker and Invidious use this proxy
      HTTPPROXY_STEALTH: "on"
      FIREWALL_INPUT_PORTS: "8282"      # Invidious reaches its companion here
      TZ: ${TZ:-UTC}

  web:
    <<: *app
    build: ./app
    container_name: tamlil-web
    mem_limit: 2g    # room for a chat answer or two from Claude Code
    extra_hosts:
      - "host.docker.internal:host-gateway"    # Ollama on this computer, for the chat

  # The one front door: Tamlil and its player on the same address (:8445).
  gateway:
    image: caddy:2-alpine
    container_name: tamlil-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8445:80"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, invidious]
    mem_limit: 256m

  worker:
    <<: *app
    container_name: tamlil-worker
    command: ["python", "-m", "tamlil.worker"]
    depends_on: [gluetun]
    environment:
      <<: *app-env
      YTDLP_PROXY: http://gluetun:8888
      GLUETUN_URL: http://gluetun:8000      # to change VPN server when YouTube blocks one (needs GLUETUN_KEY)
      GLUETUN_KEY: ${GLUETUN_KEY:-}
      PYTHONPATH: /data/pylib   # daily yt-dlp updates land here, ahead of the image's copy
      HF_HOME: /models
      WHISPER_THREADS: "8"
      WHISPER_BEAM: "5"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${MODELS_DIR:-./models}:/models   # Whisper models, downloaded on first use
    cpus: 8          # never more than half the machine; the worker also runs at nice 19
    mem_limit: 6g

  # Private Invidious: the player that timestamps open in, reached through the gateway.
  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: tamlil-invidious
    restart: unless-stopped
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${INVIDIOUS_DB_PASSWORD}
          host: invidious-db
          port: 5432
        check_tables: true
        hmac_key: ${INVIDIOUS_HMAC_KEY}
        invidious_companion:
          - private_url: "http://gluetun:8282/companion"
        invidious_companion_key: ${COMPANION_KEY}
        http_proxy:
          host: gluetun
          port: 8888
        https_only: false
        statistics_enabled: false
        registration_enabled: false
        login_enabled: false
        default_user_preferences:
          autoplay: true
          quality: dash
          quality_dash: auto
    depends_on:
      invidious-db: {condition: service_healthy}
      companion: {condition: service_started}
    mem_limit: 1g

  companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: tamlil-companion
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      SERVER_SECRET_KEY: ${COMPANION_KEY}
      JOBS_YOUTUBE_SESSION_FREQUENCY: "0 */1 * * *"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    depends_on: [gluetun]

  invidious-db:
    image: docker.io/library/postgres:14
    container_name: tamlil-invidious-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${INVIDIOUS_DB_PASSWORD}
    volumes:
      - invidiousdb:/var/lib/postgresql/data
      - ./invidious/sql:/config/sql:ro
      - ./invidious/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
    mem_limit: 512m

volumes:
  invidiousdb:
  companioncache:
